name: Varbase Content Base
description: A foundational recipe for content structure and management in Varbase. Provides core content configuration for content types, taxonomy vocabularies, block content, menu system, path aliases, and essential content-related modules.
type: Varbase Content
install:
  - node
  - taxonomy
  - text
  - views
  - field
  - block
  - block_content
  - config
  - datetime
  - file
  - image
  - options
  - path
  - entity
  - ctools
  - ctools_block
  - ctools_views
  - token
  - token_filter
  - better_exposed_filters
  - date_filter
  - field_group
  - smart_trim
  - advanced_text_formatter
  - block_class
  - contextual
  - diff
  - dynamic_page_cache
  - eca
  - bpmn_io
  - eca_ui
  - eca_base
  - eca_config
  - eca_content
  - eca_form
  - eca_misc
  - eca_user
  - eca_render
  - eca_access
  - eca_cache
  - eca_file
  - eca_menu
  - eca_queue
  - eca_views
  - eca_log
  - eca_endpoint
  - menu_ui
  - menu_link_content
  - filter
  - field_ui
  - help
  - page_cache
  - menu_block
  - views_infinite_scroll
  - entity_browser
  - entity_usage
  - entity_browser
  - entityqueue
  - entityqueue_form_widget
  - inline_entity_form
  - inline_form_errors
  - ultimate_cron
  - menu_position
  - tagify
  - rabbit_hole
config:
  strict:
    - field.storage.node.body
    - field.storage.node.field_description
    - field.storage.node.field_categories
    - field.storage.block_content.field_description
    - field.storage.taxonomy_term.field_description
  actions:
    tagify.settings:
      simpleConfigUpdate:
        set_default_widget: true
    user.role.anonymous:
      grantPermissions:
        - 'access content'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'view own unpublished content'
